<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2ee">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>給妳的每一天</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  img, svg { max-width: 100%; display: block; }
</style>
</head>
<body>
<style>
/* ============================================================
   給妳的每一天
   ============================================================ */

:root{
  --bg:#f7f2ee;
  --card:rgba(255,255,255,.84);
  --text:#302824;
  --muted:#82736b;
  --line:rgba(74,56,47,.12);
  --line-2:rgba(74,56,47,.22);
  --accent:#c9787b;
  --soft:#f2d9d8;
  --dark:#9d5357;
  --green:#668b73;
  --mkt-down:#35674f;   /* 台股：綠＝跌（已通過色覺與對比檢查） */
  --mkt-up:#c9787b;     /* 台股：紅＝漲，剛好是本頁主色 */
  --shadow:0 18px 50px rgba(75,54,44,.10);
  --font:"Avenir Next","SF Pro Display","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --topbar-h:58px;
  color-scheme: light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,#fff,transparent 34%),
    radial-gradient(circle at 90% 10%,rgba(237,205,203,.48),transparent 30%),
    var(--bg);
  background-attachment:fixed;
  font-family:var(--font);
  min-height:100vh;
  overflow-x:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{width:min(1040px,100%);margin:auto;padding:18px 18px 72px}

/* ---------------- 頂部 ---------------- */

.topbar{
  position:sticky;top:0;z-index:30;
  margin:-18px -18px 0;padding:0 18px;
  padding-top:max(10px,env(safe-area-inset-top));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:linear-gradient(to bottom,rgba(247,242,238,.94),rgba(247,242,238,.72));
}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 13px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.heart{
  width:36px;height:36px;border-radius:13px;display:grid;place-items:center;
  background:var(--soft);color:var(--dark);
  box-shadow:0 8px 24px rgba(157,83,87,.14);
}
.date{
  font-size:13px;color:var(--muted);padding:8px 11px;
  border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.65);
}

/* ---------------- 首頁大標 ---------------- */

.home-hero{margin-top:24px;padding:12px 2px 8px}
.home-hero[hidden]{display:none}
.home-hero h1{
  margin:0 0 24px;
  font-size:clamp(44px,8vw,78px);font-weight:700;line-height:1.1;letter-spacing:-.03em;
  text-wrap:balance;
}
.home-hero p{max-width:820px;margin:0;color:var(--muted);font-size:clamp(17px,2vw,22px);line-height:1.9}

.stats{
  display:grid;grid-template-columns:repeat(3,1fr);margin-top:34px;
  border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.46);
}
.stat{padding:24px 26px}
.stat+.stat{border-left:1px solid var(--line)}
.stat strong{display:block;font-size:clamp(30px,4vw,44px);line-height:1;font-weight:750;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:8px;color:var(--muted);font-size:14px}

/* ---------------- 頁籤 ---------------- */

.home-tabs-wrap{
  position:sticky;top:var(--topbar-h);z-index:20;
  margin:38px -18px 0;padding:0 18px;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:linear-gradient(to bottom,rgba(247,242,238,.94),rgba(247,242,238,.78));
}
.home-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.home-tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:0;background:transparent;color:var(--muted);
  border-bottom:3px solid transparent;
  padding:16px 18px 17px;font-weight:700;font-size:16px;white-space:nowrap;
  transition:color .2s;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab:focus-visible{outline-offset:-3px;border-radius:4px}

/* ---------------- 分頁 ---------------- */

.page[hidden]{display:none}
.page{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.hero{
  margin-top:18px;padding:clamp(24px,5vw,52px);
  border:1px solid rgba(255,255,255,.75);border-radius:32px;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,248,246,.7));
  box-shadow:var(--shadow);overflow:hidden;position:relative;
}
.hero:after{
  content:"";position:absolute;width:210px;height:210px;border-radius:50%;
  right:-65px;top:-75px;background:rgba(242,217,216,.67);
}
.eyebrow{color:var(--dark);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;position:relative;z-index:2}
.hero h1{
  position:relative;z-index:2;max-width:760px;margin:12px 0;
  font-size:clamp(30px,5.4vw,50px);font-weight:700;line-height:1.25;letter-spacing:-.03em;
  text-wrap:balance;
}
.hero p{position:relative;z-index:2;max-width:680px;color:var(--muted);line-height:1.9;margin:0}

.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:34px 2px 14px}
.sectionhead h2{margin:0;font-size:23px}
.sectionhead p{margin:5px 0 0;color:var(--muted);font-size:14px}

.quote{
  margin:34px 0 24px;padding:4px 0 4px 22px;border-left:4px solid var(--soft);
  font-size:clamp(18px,2vw,24px);line-height:1.7;color:var(--muted);
}

/* ---------------- 卡片 ---------------- */

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid rgba(255,255,255,.78);border-radius:24px;
  padding:20px;box-shadow:0 10px 30px rgba(75,54,44,.065);
}
.card h3{margin:12px 0 7px;font-size:19px;line-height:1.5;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.8}
.number{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:var(--soft);color:var(--dark);font-weight:900;margin-bottom:15px;
}
.proof{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);color:#665952;font-size:13px;line-height:1.75}

.trip{min-height:210px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(250,233,230,.82))}
.tripmeta{color:var(--dark);font-size:13px;font-weight:800}
.trip h3{font-size:25px;margin:10px 0 8px}
.tripfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-top:24px}
.tag{font-size:12px;font-weight:700;color:var(--green);background:rgba(102,139,115,.11);border-radius:999px;padding:6px 9px;white-space:nowrap}
.tag.plan{color:#96702f;background:rgba(150,112,47,.12)}
.tag.wish{color:var(--dark);background:rgba(157,83,87,.09)}
.tag.done{color:var(--muted);background:rgba(74,56,47,.07)}

/* ---------------- 時間軸 ---------------- */

.timeline{position:relative;margin-left:12px;padding-left:42px}
.timeline:before{content:"";position:absolute;left:10px;top:4px;bottom:8px;width:2px;
  background:linear-gradient(var(--accent),rgba(201,120,123,.16))}
.timeline-item{position:relative;padding:0 0 34px}
.timeline-dot{position:absolute;left:-42px;top:2px;width:22px;height:22px;border-radius:50%;
  background:var(--accent);border:5px solid var(--bg);box-shadow:0 0 0 2px rgba(201,120,123,.48)}
.timeline-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.timeline-date{font-weight:800;color:var(--dark);letter-spacing:.08em}
.timeline-day{font-size:12px;letter-spacing:.16em;color:var(--muted);font-family:var(--mono)}
.timeline-item h3{margin:14px 0 8px;font-size:clamp(23px,3vw,34px);font-weight:650;line-height:1.4;text-wrap:balance}
.timeline-item p{margin:0;color:var(--muted);line-height:1.9;font-size:16px}
.tl-tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:0;list-style:none}
.tl-tags li{font-size:12px;color:var(--green);background:rgba(102,139,115,.11);border-radius:999px;padding:5px 10px}

.timeline-end{position:relative;color:var(--muted);font-size:13px;letter-spacing:.1em;padding-bottom:8px}
.timeline-end:before{content:"";position:absolute;left:-36px;top:6px;width:10px;height:10px;border-radius:50%;
  background:rgba(201,120,123,.3);border:4px solid var(--bg)}

/* 草稿 */
.timeline-item.draft .timeline-dot{background:var(--bg);border:3px dashed var(--accent);box-shadow:none}
.draft-flag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--dark);
  background:rgba(157,83,87,.1);border-radius:999px;padding:4px 9px;margin-left:10px;vertical-align:3px}
.draft-del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px;min-height:34px}
.draft-del:hover{color:var(--dark);background:rgba(157,83,87,.08)}

/* ---------------- 小行事曆 ---------------- */

.cal{
  margin-top:18px;max-width:400px;padding:18px 18px 16px;
  border:1px solid rgba(255,255,255,.75);border-radius:24px;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,248,246,.7));
  box-shadow:var(--shadow);
}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-title{font-weight:800;font-size:17px;letter-spacing:.02em}
.cal-nav{display:flex;gap:6px}
.cal-nav button{
  width:34px;height:34px;border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.75);color:var(--muted);font-size:17px;line-height:1;
  display:grid;place-items:center;transition:.16s;
}
.cal-nav button:hover{border-color:var(--accent);color:var(--dark)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:14px}
.cal-dow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:2px 0 6px}
.cal-cell{
  position:relative;height:38px;border:0;background:none;border-radius:11px;
  font-size:13.5px;font-weight:600;color:var(--text);display:grid;place-items:center;
  font-variant-numeric:tabular-nums;transition:.14s;
}
.cal-cell.out{color:rgba(48,40,36,.2);font-weight:500}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.cal-cell.has{background:var(--soft);color:var(--dark);font-weight:800;cursor:pointer}
.cal-cell.has:hover{background:#eec9c8}
.cal-cell.has.past{background:rgba(74,56,47,.07);color:var(--muted)}
.cal-cell .pip{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--green)}
.cal-cell .pip.plan{background:#96702f}
.cal-cell .pip.wish{background:var(--dark)}
.cal-cell .pip.done{background:rgba(74,56,47,.4)}

.cal-foot{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);line-height:1.7}
.cal-foot b{color:var(--dark)}

.trip.flash{animation:flash 1.5s ease}
@keyframes flash{
  0%{box-shadow:0 0 0 0 rgba(201,120,123,.55)}
  100%{box-shadow:0 0 0 16px rgba(201,120,123,0)}
}

/* ---------------- 她的認證 ---------------- */

.tally{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.tally span{font-size:12.5px;font-weight:800;border-radius:999px;padding:6px 12px}
.tally-y{color:#fff;background:var(--mkt-down)}
.tally-n{color:var(--dark);background:rgba(157,83,87,.13)}
.tally-r{color:var(--muted);background:rgba(74,56,47,.07)}

.judge{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.judge-q{font-size:13px;color:var(--muted);font-weight:700;margin-right:2px}
.jbtn{
  border:1.5px solid var(--line-2);background:rgba(255,255,255,.72);color:var(--muted);
  border-radius:999px;padding:8px 16px;min-height:40px;font-size:14px;font-weight:800;transition:.15s;
}
.jbtn:hover{border-color:var(--dark);color:var(--dark)}
.jbtn.yes.on{background:var(--mkt-down);border-color:var(--mkt-down);color:#fff}
.jbtn.no.on{background:var(--dark);border-color:var(--dark);color:#fff}

.timeline-item.judged-yes .timeline-dot{background:var(--mkt-down);box-shadow:0 0 0 2px rgba(53,103,79,.4)}
.timeline-item.judged-no .timeline-dot{background:var(--bg);border:5px solid var(--bg);box-shadow:0 0 0 2px var(--dark)}

.empty-day .timeline-dot{background:var(--bg);border:4px dashed var(--line-2);box-shadow:none;width:22px;height:22px}
.empty-day h3{color:var(--muted)}
.judge.preview{opacity:.55}
.judge.preview .jbtn{cursor:default}

/* 已讀回條的告知文字 */
.readnote{
  margin-top:18px;padding:11px 14px;border-radius:14px;
  background:rgba(74,56,47,.05);border:1px solid var(--line);
  font-size:12px;line-height:1.75;color:var(--muted);
}

.hersend{
  margin-top:8px;padding:16px 18px;border-radius:20px;border:1px solid rgba(201,120,123,.32);
  background:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:12px;align-items:flex-start;
}
.hersend-txt{font-size:13.5px;line-height:1.8;color:var(--muted)}
.hersend-btns{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.hernote{
  width:100%;border:1.5px solid var(--line-2);border-radius:14px;padding:11px 13px;
  background:rgba(255,255,255,.85);color:var(--text);font-size:15px;line-height:1.7;
  resize:vertical;min-height:64px;font-family:var(--font);
}
.hernote:focus{border-color:var(--accent);outline:2px solid rgba(201,120,123,.25);outline-offset:0}
.hersend .primary:disabled{opacity:.6;cursor:wait}
.hersend-hint{margin-top:8px;font-size:12.5px;line-height:1.8;color:var(--muted);text-align:center}

/* ---------------- 出遊：排序與日期 ---------------- */

.triptop{display:flex;justify-content:flex-end;margin-bottom:4px}
.ord{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--dark);
  background:rgba(157,83,87,.1);border-radius:999px;padding:4px 10px}

.trip-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.mv{
  width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line-2);
  background:rgba(255,255,255,.8);color:var(--dark);font-size:16px;font-weight:800;
  display:grid;place-items:center;transition:.15s;flex:0 0 auto;
}
.mv:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.mv:disabled{opacity:.3;cursor:not-allowed}
.dpick{display:flex;align-items:center;gap:7px;flex:1;min-width:150px}
.dpick span{font-size:12.5px;font-weight:800;color:var(--muted);flex:0 0 auto}
.dpick input{
  flex:1;min-width:0;border:1.5px solid var(--line-2);border-radius:12px;padding:9px 10px;
  background:rgba(255,255,255,.85);color:var(--text);font-size:14.5px;min-height:42px;
}
.dpick input:focus{border-color:var(--accent);outline:2px solid rgba(201,120,123,.25)}
.clr{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:700;
  padding:8px 6px;min-height:40px;border-radius:8px;flex:0 0 auto}
.clr:hover{color:var(--dark);background:rgba(157,83,87,.08)}

/* ---------------- 行情專區 ---------------- */

.mkt{
  margin-top:18px;padding:20px 18px 16px;
  border:1px solid rgba(255,255,255,.75);border-radius:24px;
  background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,248,246,.72));
  box-shadow:var(--shadow);
}
.mkt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.mkt-name{display:flex;align-items:baseline;gap:9px}
.mkt-name b{font-size:20px;font-weight:800}
.mkt-name code{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.08em}
.mkt-rating{
  font-size:12.5px;font-weight:800;color:var(--dark);background:var(--soft);
  border-radius:999px;padding:6px 12px;white-space:nowrap;
}
.mkt-price{display:flex;align-items:baseline;gap:11px;margin-top:10px;flex-wrap:wrap}
.mkt-price .now{font-size:34px;font-weight:750;line-height:1;color:var(--mkt-down);font-variant-numeric:tabular-nums}
.mkt-price .chg{font-size:14.5px;font-weight:750;color:var(--mkt-down);font-variant-numeric:tabular-nums}
.mkt-sub{margin-top:7px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.mkt-figure{position:relative;margin-top:20px}
.mkt-plot{position:relative;height:300px}
.mkt-plot svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.mkt-pt{
  position:absolute;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 1px 5px rgba(75,54,44,.28);
}
.mkt-pt.buy{width:14px;height:14px;background:var(--mkt-up)}
.mkt-pt.add{background:#fff;border:2.5px solid var(--mkt-up)}
.mkt-pt.now{background:var(--mkt-down)}
.mkt-pt.now:after{
  content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--mkt-down);
  animation:pulse 2.2s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}

.mkt-tag{
  position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-size:11.5px;font-weight:800;letter-spacing:.03em;border-radius:999px;padding:4px 9px;
  background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(75,54,44,.14);
}
.mkt-tag.up{color:var(--mkt-up)}
.mkt-tag.down{color:var(--mkt-down)}

.mkt-call{
  position:absolute;left:27%;top:4%;width:44%;
  background:rgba(255,255,255,.95);border:1px solid rgba(201,120,123,.35);
  border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(75,54,44,.14);
}
.mkt-call .who{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mkt-call .say{margin-top:5px;font-size:15px;font-weight:800;line-height:1.5;color:var(--mkt-up)}
.mkt-call .why{margin-top:6px;font-size:12px;line-height:1.65;color:var(--muted)}

.mkt-xaxis{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--muted);font-weight:700}
.mkt-xaxis span:nth-child(2){color:var(--mkt-down)}
.mkt-xaxis span:nth-child(3){color:var(--mkt-up)}

.mkt-log{margin-top:14px;border-top:1px solid var(--line)}
.mkt-row{display:flex;align-items:flex-start;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.mkt-row:last-child{border-bottom:0}
.mkt-act{
  flex:0 0 auto;min-width:46px;text-align:center;font-size:11.5px;font-weight:800;
  border-radius:8px;padding:5px 9px;white-space:nowrap;
}
.mkt-act.buy{color:#fff;background:var(--mkt-up)}
.mkt-act.add{color:var(--mkt-up);border:1.5px solid rgba(201,120,123,.5)}
.mkt-act.now{color:#fff;background:var(--mkt-down)}
.mkt-row .txt{flex:1;min-width:0;font-size:14.5px;line-height:1.65}
.mkt-row .txt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mkt-row .val{flex:0 0 auto;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}

.mkt-note{margin-top:16px;font-size:12px;line-height:1.8;color:var(--muted)}
.mkt-note b{color:var(--dark)}

/* ---------------- 承諾 ---------------- */

.pledgebar{margin-top:18px;display:flex;flex-direction:column;gap:11px}
.pledgebar .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--muted)}
.pledgebar .row b{font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:rgba(74,56,47,.09);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;width:0;
  background:linear-gradient(to right,var(--soft),var(--accent));
  transition:width 1s cubic-bezier(.2,.7,.3,1)}
.card.undone{background:rgba(255,255,255,.5);border-style:dashed;border-color:var(--line-2)}
.card.undone .number{background:rgba(74,56,47,.07);color:var(--muted)}

/* ---------------- 信 ---------------- */

.letter{margin-top:18px;padding:clamp(24px,5vw,48px);font-size:18px;line-height:2}
.letter p{margin:0 0 1.2em;text-wrap:pretty}
.letter p:last-of-type{margin-bottom:0}
.signature{text-align:right;color:var(--dark);font-weight:700;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}

/* ---------------- 編輯模式 ---------------- */

.editbar{
  display:flex;flex-direction:column;gap:13px;margin:0 0 26px;padding:18px 20px;
  border:1px dashed var(--line-2);border-radius:20px;background:rgba(255,255,255,.45);
}
.editbar-note{font-size:13.5px;line-height:1.8;color:var(--muted)}
.editbar-note b{color:var(--dark)}
.editbar-note .k{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dark);margin-bottom:5px}
.editbar-btns{display:flex;gap:9px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line-2);background:rgba(255,255,255,.8);border-radius:14px;
  padding:11px 15px;font-weight:700;font-size:14.5px;min-height:44px;transition:.18s;
}
.btn:hover{border-color:var(--accent);color:var(--dark)}
.primary{border:0;border-radius:14px;color:#fff;background:var(--accent);padding:11px 15px;font-weight:750;
  box-shadow:0 8px 18px rgba(201,120,123,.23);min-height:44px;font-size:14.5px}
.primary:hover{filter:brightness(1.05)}
.daily-actions{display:flex;justify-content:flex-end;margin-bottom:20px}

.modal{position:fixed;inset:0;z-index:60;display:none;place-items:end center;padding:0;
  background:rgba(42,32,28,.36);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal.open{display:grid}
.dialog{
  width:min(560px,100%);max-height:92vh;overflow-y:auto;background:#fff;
  border-radius:26px 26px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 30px 80px rgba(44,31,26,.26);
  animation:up .3s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dialog h3{margin:0;font-size:20px}
.close{border:0;background:#f4efec;width:38px;height:38px;border-radius:12px;font-size:20px;color:var(--muted);flex:0 0 auto}
.field{margin-top:15px}
.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}
.field label em{font-style:normal;font-weight:400;color:var(--muted)}
.field input,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;
  background:#fbf9f8;color:var(--text);outline:none;font-size:16px;line-height:1.7;
}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:2px solid rgba(201,120,123,.25);outline-offset:0}
.field textarea{min-height:110px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.ghost{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 15px;min-height:44px}

.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:70;background:var(--text);color:#fff;font-size:14px;line-height:1.65;padding:12px 18px;
  border-radius:14px;box-shadow:0 18px 44px rgba(44,31,26,.3);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:calc(100vw - 40px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.8}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:44px 20px}

@media(max-width:720px){

  .card{padding:18px;border-radius:20px}

const fmtDate = (s) => new Intl.DateTimeFormat('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' }).format(parseDate(s));

try { drafts = JSON.parse(localStorage.getItem(DRAFT_KEY)) || []; } catch (e) { drafts = []; }

/* ---- 她的操作：認證每日改變、排出遊順序、填日期 ----
   一樣只存在她自己的手機。她按「把我的意見傳給他」才會變成一段文字，
   複製起來貼到 LINE 給你。這頁沒有後端，沒有別的路。 */
const HER_KEY = 'her-feedback-v1';
const HER_BLANK = { verdicts: {}, order: [], dates: {} };
let her = HER_BLANK;
try { her = Object.assign({}, HER_BLANK, JSON.parse(localStorage.getItem(HER_KEY)) || {}); } catch (e) {}
const saveHer = () => { try { localStorage.setItem(HER_KEY, JSON.stringify(her)); } catch (e) {} };
const herTouched = () =>
  Object.keys(her.verdicts).length > 0 || her.order.length > 0 || Object.keys(her.dates).length > 0;

/* 她排過的順序優先，沒排過的照原順序接在後面 */
function tripsOrdered() {
  const base = TRIPS.map((t, i) => ({ ...t, key: t.title, orig: i }));
  if (!her.order.length) return base;
  const rank = (t) => { const i = her.order.indexOf(t.key); return i === -1 ? 999 + t.orig : i; };
  return base.slice().sort((a, b) => rank(a) - rank(b));
}
const tripDate = (t) => her.dates[t.key || t.title] || t.date || null;

function tripMove(key, dir) {
  const cur = tripsOrdered().map((t) => t.key);
  const i = cur.indexOf(key);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= cur.length) return;
  cur.splice(j, 0, cur.splice(i, 1)[0]);
  her.order = cur;
  saveHer();
}

const allEntries = () => [
  ...drafts.map((d, i) => ({ ...d, draft: true, di: i })),
  ...ENTRIES,
].sort((a, b) => b.date.localeCompare(a.date));

/* ---- 數據 ---- */
function refreshStats(animate) {
  const list = allEntries();
  const dates = [...new Set(list.map((e) => e.date))].sort();
  const newest = dates[dates.length - 1] || CONFIG.startDate;
  const span = Math.max(0, dayIndex(newest));
  document.getElementById('statEntries').textContent = list.length;
  document.getElementById('statBlank').textContent = Math.max(0, span - dates.length);

  const el = document.getElementById('statDays');
  if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = span; return; }
  const t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / 900);
    el.textContent = Math.round(span * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---- 小行事曆 ---- */
const CAL_DOW = ['日', '一', '二', '三', '四', '五', '六'];
let calYM = null;

function calInit() {
  if (calYM) return;
  const t0 = today();
  const dated = tripsOrdered().map((t) => tripDate(t)).filter(Boolean).sort();
  const next = dated.find((d) => d >= t0);
  calYM = (next || dated[dated.length - 1] || t0).slice(0, 7);
}

function calShift(n) {
  const [y, m] = calYM.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  calYM = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  calPaint();
}

function calPaint() {
  const body = document.getElementById('cal-body');
  if (!body) return;
  const [y, m] = calYM.split('-').map(Number);
  const t0 = today();
  const firstDow = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const prevDays = new Date(y, m - 1, 0).getDate();
  const rows = Math.ceil((firstDow + days) / 7);

  const byDate = {};
  tripsOrdered().forEach((t, i) => {
    const d = tripDate(t);
    if (d) (byDate[d] = byDate[d] || []).push({ ...t, i });
  });

  let cells = CAL_DOW.map((d) => `<div class="cal-dow">${d}</div>`).join('');
  for (let n = 0; n < rows * 7; n++) {
    const dayNum = n - firstDow + 1;
    if (dayNum < 1) { cells += `<div class="cal-cell out">${prevDays + dayNum}</div>`; continue; }
    if (dayNum > days) { cells += `<div class="cal-cell out">${dayNum - days}</div>`; continue; }
    const iso = y + '-' + String(m).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
    const hit = byDate[iso];
    const cls = ['cal-cell'];
    if (iso === t0) cls.push('today');
    if (hit) { cls.push('has'); if (iso < t0) cls.push('past'); }
    cells += hit
      ? `<button type="button" class="${cls.join(' ')}" data-cal-day="${hit[0].i}" aria-label="${esc(hit.map((h) => h.title).join('、'))}">${dayNum}<span class="pip ${esc(hit[0].status)}"></span></button>`
      : `<div class="${cls.join(' ')}">${dayNum}</div>`;
  }
  body.innerHTML = cells;

  document.getElementById('cal-title').textContent = y + ' 年 ' + m + ' 月';
  const inMonth = tripsOrdered().filter((t) => (tripDate(t) || '').slice(0, 7) === calYM).length;
  const undated = tripsOrdered().filter((t) => !tripDate(t)).length;
  document.getElementById('cal-foot').innerHTML =
    (inMonth ? `這個月有 <b>${inMonth}</b> 個行程，點日期看細節。` : '這個月還沒排東西。') +
    (undated ? ` 另外有 <b>${undated}</b> 個還沒填日期，往下捲可以自己填。` : '');
}

/* ---- 行情走勢圖 ----
   幾何用 SVG（preserveAspectRatio="none" 讓它隨寬度伸縮，
   stroke 用 non-scaling-stroke 所以線不會變形）；
   圓點與文字用 HTML 疊在上面，才不會被拉扁、字也不會變小。 */
const MKT_SPLIT = 62;                       // 「現在」落在寬度的 62%
const mktY = (v) => 94 - v * 0.88;          // 0–100 → 6–94（上下留白）
const mktXa = (i) => (i / (MARKET.actual.length - 1)) * MKT_SPLIT;
const mktXf = (j) => MKT_SPLIT + (j / (MARKET.forecast.length - 1)) * (100 - MKT_SPLIT);
const pts = (arr, xf) => arr.map((v, i) => xf(i).toFixed(2) + ',' + mktY(v).toFixed(2));

function renderMarket() {
  const a = MARKET.actual, f = MARKET.forecast;
  const aPts = pts(a, mktXa), fPts = pts(f, mktXf);
  const high = Math.max(...a), low = Math.min(...a), now = a[a.length - 1];
  const drop = now - high, dropPct = (drop / high) * 100;
  const peak = f[f.length - 1];

  const grid = [6, 28, 50, 72, 94].map((y) =>
    `<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="rgba(74,56,47,.09)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');

  const marks = [
    `<span class="mkt-pt buy" style="left:${mktXa(MARKET.buyAt)}%;top:${mktY(a[MARKET.buyAt])}%"></span>`,
    `<span class="mkt-tag up" style="left:${mktXa(MARKET.buyAt) + 11}%;top:${mktY(a[MARKET.buyAt]) - 12}%">買入</span>`,
    ...MARKET.adds.flatMap((i, k) => [
      `<span class="mkt-pt add" style="left:${mktXa(i)}%;top:${mktY(a[i])}%"></span>`,
      `<span class="mkt-tag up" style="left:${mktXa(i)}%;top:${mktY(a[i]) + MARKET.addDy[k]}%">${esc(MARKET.addLabel)}</span>`,
    ]),
    `<span class="mkt-pt now" style="left:${MKT_SPLIT}%;top:${mktY(now)}%"></span>`,
    `<span class="mkt-tag down" style="left:${MKT_SPLIT - 14}%;top:${mktY(now) - 12}%">現在</span>`,
  ].join('');

  return `
    <div class="mkt">
      <div class="mkt-head">
        <div class="mkt-name"><b>${esc(MARKET.name)}</b><code>${esc(MARKET.code)}</code></div>
        <div class="mkt-rating">分析師評等 · ${esc(MARKET.rating)}</div>
      </div>
      <div class="mkt-price">
        <span class="now">${now.toFixed(1)}</span>
        <span class="chg">▼ ${Math.abs(drop).toFixed(1)}（${dropPct.toFixed(1)}%）</span>
      </div>
      <div class="mkt-sub">${esc(MARKET.metric)} · 最高 ${high.toFixed(1)} · 最低 ${low.toFixed(1)} · 從最高點跌 ${Math.abs(dropPct).toFixed(0)}%</div>

      <div class="mkt-figure">
      <div class="mkt-plot">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img"
             aria-label="走勢圖：從 ${high.toFixed(0)} 一路下跌到 ${now.toFixed(0)}，中間加碼三次，預估之後回升到 ${peak}。細節在下方的持倉紀錄。">
          <defs>
            <linearGradient id="mktDownFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(53,103,79,.20)"/><stop offset="100%" stop-color="rgba(53,103,79,0)"/>
            </linearGradient>
            <linearGradient id="mktUpFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(201,120,123,.26)"/><stop offset="100%" stop-color="rgba(201,120,123,0)"/>
            </linearGradient>
          </defs>
          ${grid}
          <polygon points="0,100 ${aPts.join(' ')} ${MKT_SPLIT},100" fill="url(#mktDownFill)"/>
          <polygon points="${MKT_SPLIT},100 ${fPts.join(' ')} 100,100" fill="url(#mktUpFill)"/>
          <line x1="${MKT_SPLIT}" y1="0" x2="${MKT_SPLIT}" y2="100"
                stroke="rgba(74,56,47,.25)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
          <polyline points="${aPts.join(' ')}" fill="none" stroke="var(--mkt-down)" stroke-width="2.5"
                    stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          <polyline points="${fPts.join(' ')}" fill="none" stroke="var(--mkt-up)" stroke-width="2.5"
                    stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
        ${marks}
      </div>
      <div class="mkt-call">
        <div class="who">分析師</div>
        <div class="say">${esc(MARKET.analyst)}</div>
        <div class="why">${esc(MARKET.analystWhy)}</div>
      </div>
      </div>
      <div class="mkt-xaxis">${MARKET.xLabels.map((l) => `<span>${esc(l)}</span>`).join('')}</div>

      <div class="mkt-log">
        ${MARKET.log.map((r, i) => {

          </div>`;
        }).join('')}
      </div>

      <p class="mkt-note">${esc(MARKET.disclaimer)}</p>
    </div>`;
}

/* ---- 她按完之後，怎麼把意見送到你手上 ----
   這頁沒有後端，她按的東西只在她自己手機裡。
   所以給她一顆按鈕，把她做的事整理成一段文字複製走，貼到 LINE 傳給你。 */
/* 便條的值要從「目前這一頁」讀，不能用 id —— 每日改變和出遊各有一個，
   會撞 id。重繪時舊 DOM 還在，所以讀得到她剛打的字。 */
function herNoteValue() {
  const host = pageEls && pageEls[current];
  const el = host && host.querySelector('[data-hernote]');
  return el ? el.value : '';
}

function herSendHTML(where) {
  if (!herTouched()) {
    return `<p class="hersend-hint">${where === 'daily'
      ? '妳按了之後只有妳自己看得到。按完下面會出現一顆傳給他的按鈕。'
      : '妳排的順序和填的日期只存在這支手機。排完下面會出現一顆傳給他的按鈕。'}</p>`;
  }
  const direct = inboxReady();
  return `
    <div class="hersend">
      <div class="hersend-txt">${direct
        ? '按下去會直接送到他那邊，妳不用再自己貼。想補一句話就寫在下面，可以不寫。'
        : '妳做的這些只在這支手機裡，他看不到。按下去會複製成一段文字，貼到 LINE 傳給他就好。'}</div>
      <textarea data-hernote class="hernote" rows="2" maxlength="500"
        placeholder="想跟他說什麼？（可以留空）">${esc(herNoteValue())}</textarea>
      <div class="hersend-btns">
        <button type="button" class="primary" id="btnHerSend">把我的意見傳給他</button>
        ${direct ? '<button type="button" class="btn" id="btnHerCopy">改用複製的</button>' : ''}
      </div>
    </div>`;
}

function herSummary() {
  const L = [];
  const list = allEntries();
  const V = her.verdicts;
  const y = list.filter((e) => V[e.date] === 'yes');
  const n = list.filter((e) => V[e.date] === 'no');
  if (y.length || n.length) {
    L.push('【每日改變】我看過了');
    y.forEach((e) => L.push(`  ✓ 做到了 — ${fmtDate(e.date)}　${e.title}`));
    n.forEach((e) => L.push(`  ✗ 沒有 — ${fmtDate(e.date)}　${e.title}`));
    const rest = list.length - y.length - n.length;
    if (rest) L.push(`  （還有 ${rest} 則我還沒看）`);
  }
  if (her.order.length || Object.keys(her.dates).length) {
    if (L.length) L.push('');
    L.push('【出遊】我排的順序');
    tripsOrdered().forEach((t, i) => {
      const d = tripDate(t);
      L.push(`  ${i + 1}. ${t.title}${d ? '　' + fmtDate(d) : '　（還沒定日期）'}`);
    });
  }
  const note = herNoteValue();
  if (note && note.trim()) { if (L.length) L.push(''); L.push('【她說】'); L.push('  ' + note.trim()); }
  return L.join('\n');
}

const inboxReady = () => Boolean(INBOX.formId && INBOX.entryText);

function copyText(text, msg) {
  const done = () => toast(msg);
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;top:-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (err) { prompt('長按選取複製：', text); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

/* 用隱藏 iframe 送出，頁面不會跳走。
   Google 表單不允許跨網域讀回應，所以我們讀不到成功與否，
   只能靠 iframe 的 load 事件判斷 POST 有跑完；逾時就退回複製。 */
function inboxSend(text, btn) {
  return new Promise((resolve, reject) => {
    const id = 'gf' + Math.floor(performance.now());
    const frame = document.createElement('iframe');
    frame.name = id; frame.id = id; frame.style.display = 'none';
    const form = document.createElement('form');
    form.action = 'https://docs.google.com/forms/d/e/' + INBOX.formId + '/formResponse';
    form.method = 'POST'; form.target = id; form.style.display = 'none';
    const put = (name, value) => {
      const i = document.createElement('input');
      i.type = 'hidden'; i.name = name; i.value = value;
      form.appendChild(i);
    };
    put(INBOX.entryText, text);
    if (INBOX.entryFrom) put(INBOX.entryFrom, INBOX.fromLabel);

    let settled = false;
    const cleanup = () => { frame.remove(); form.remove(); };
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true; cleanup(); reject(new Error('timeout'));
    }, 8000);
    frame.addEventListener('load', () => {
      if (settled) return;
      settled = true; clearTimeout(timer); cleanup(); resolve();
    });

    document.body.appendChild(frame);
    document.body.appendChild(form);
    form.submit();
  });
}

function herExport(btn) {
  const text = herSummary();
  if (!text) { toast('還沒有東西可以傳。'); return; }

  if (!inboxReady()) { copyText(text, '複製好了，貼到 LINE 傳給他。'); return; }

  if (btn) { btn.disabled = true; btn.textContent = '傳送中…'; }
  inboxSend(text, btn).then(() => {
    if (btn) { btn.disabled = false; btn.textContent = '已經傳給他了'; }
    toast('傳出去了。他會在他的收件匣看到。');
  }).catch(() => {
    if (btn) { btn.disabled = false; btn.textContent = '把我的意見傳給他'; }
    copyText(text, '傳送失敗，已改成複製。貼到 LINE 傳給他就好。');
  });
}

const RENDER = { daily: renderDaily, explain: renderExplain, trip: renderTrip, market: renderMarket, future: renderFuture, letter: renderLetter };

/* ---- 組裝 ---- */
const nav = document.querySelector('.home-tabs');
const host = document.getElementById('panels');
const masthead = document.getElementById('masthead');

TABS.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.type = 'button';
  b.id = 'tab-' + t.id;
  b.textContent = t.label;
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-selected', String(i === 0));
  b.setAttribute('aria-controls', 'page-' + t.id);
  b.tabIndex = i === 0 ? 0 : -1;
  b.addEventListener('click', () => select(i));
  nav.appendChild(b);

  const s = document.createElement('section');
  s.className = 'page';
  s.id = 'page-' + t.id;
  s.setAttribute('role', 'tabpanel');
  s.setAttribute('aria-labelledby', 'tab-' + t.id);
  s.tabIndex = 0;
  s.hidden = i !== 0;
  host.appendChild(s);
});

const tabEls = [...nav.children];
const pageEls = [...host.children];
let current = 0;

function paint(i) {
  pageEls[i].innerHTML = RENDER[TABS[i].id]();
  pageEls[i].querySelectorAll('.bar i').forEach((el) => requestAnimationFrame(() => { el.style.width = el.dataset.w + '%'; }));
  if (TABS[i].id === 'trip') calPaint();
}

function select(i, focus) {
  if (i === current) return;
  tabEls[current].setAttribute('aria-selected', 'false');
  tabEls[current].tabIndex = -1;
  pageEls[current].hidden = true;

  current = i;
  tabEls[i].setAttribute('aria-selected', 'true');
  tabEls[i].tabIndex = 0;
  pageEls[i].hidden = false;
  paint(i);
  masthead.hidden = TABS[i].id !== 'daily';
  if (focus) tabEls[i].focus();
  tabEls[i].scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

nav.addEventListener('keydown', (e) => {
  const map = { ArrowRight: current + 1, ArrowLeft: current - 1, Home: 0, End: tabEls.length - 1 };
  if (!(e.key in map)) return;
  e.preventDefault();
  select((map[e.key] + tabEls.length) % tabEls.length, true);
});

/* 頁籤吸頂位置跟著頂部列高度走 */
const topbar = document.querySelector('.topbar');
const syncTop = () => document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
syncTop();
if (window.ResizeObserver) new ResizeObserver(syncTop).observe(topbar);
else addEventListener('resize', syncTop);

/* ---- 提示 ---- */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ---- 新增 / 刪除草稿 ---- */
const modal = document.getElementById('modal');
const form = document.getElementById('form');
const openModal = () => {
  document.getElementById('f-date').value = today();
  modal.classList.add('open');
  document.getElementById('f-title').focus();
};
const shut = () => { modal.classList.remove('open'); form.reset(); };
document.getElementById('close').onclick = shut;
document.getElementById('cancel').onclick = shut;
modal.addEventListener('click', (e) => { if (e.target === modal) shut(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) shut(); });

form.addEventListener('submit', (e) => {
  e.preventDefault();
  drafts.push({
    date: document.getElementById('f-date').value,
    title: document.getElementById('f-title').value.trim(),
    body: document.getElementById('f-body').value.trim(),
    tags: document.getElementById('f-tags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean),
  });
  saveDrafts();
  shut();
  paint(current);
  refreshStats(false);
  toast('存好了。記得按「複製全部內容」交給 Claude，她那邊才看得到。');
});

host.addEventListener('click', (e) => {
  const add = e.target.closest('#btnAdd');
  if (add) return openModal();

  const exp = e.target.closest('#btnExport');
  if (exp) return exportAll();

  const nav = e.target.closest('[data-cal-nav]');
  if (nav) return calShift(Number(nav.dataset.calNav));

  /* 她按「做到了 / 沒有」—— 再按一次同一顆就取消 */
  const j = e.target.closest('[data-judge]');
  if (j) {
    const d = j.dataset.judge;
    her.verdicts[d] = her.verdicts[d] === j.dataset.v ? undefined : j.dataset.v;
    if (!her.verdicts[d]) delete her.verdicts[d];
    saveHer();
    const y = window.scrollY;
    paint(current);
    window.scrollTo(0, y);
    return;
  }

  /* 她調整出遊順序 */
  const mv = e.target.closest('[data-mv]');
  if (mv) {
    tripMove(mv.dataset.mv, Number(mv.dataset.dir));
    const y = window.scrollY;
    paint(current);
    window.scrollTo(0, y);
    return;
  }

  /* 她清掉某個行程的日期 */
  const clr = e.target.closest('[data-clr]');
  if (clr) {
    delete her.dates[clr.dataset.clr];
    saveHer();
    const y = window.scrollY;
    paint(current);
    window.scrollTo(0, y);
    return;
  }

  const send = e.target.closest('#btnHerSend');
  if (send) return herExport(send);
  if (e.target.closest('#btnHerCopy')) {
    const t = herSummary();
    return t ? copyText(t, '複製好了，貼到 LINE 傳給他。') : toast('還沒有東西可以傳。');
  }

  const day = e.target.closest('[data-cal-day]');
  if (day) {
    const card = document.getElementById('trip-' + day.dataset.calDay);
    if (!card) return;
    card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    card.classList.remove('flash');
    void card.offsetWidth;
    card.classList.add('flash');
    return;
  }

  const del = e.target.closest('[data-del]');
  if (del && confirm('要刪掉這則草稿嗎？刪了救不回來。')) {
    drafts.splice(Number(del.dataset.del), 1);
    saveDrafts();
    paint(current);
    refreshStats(false);
  }
});

/* 她填日期（date input 不會冒泡 click，要聽 change） */
host.addEventListener('change', (e) => {
  const d = e.target.closest('[data-date]');
  if (!d) return;
  const key = d.dataset.date;
  if (d.value) her.dates[key] = d.value; else delete her.dates[key];
  saveHer();
  const y = window.scrollY;
  paint(current);
  window.scrollTo(0, y);
});

/* ---- 匯出：產生可以直接貼回程式碼的 ENTRIES ---- */
function exportAll() {
  const q = (s) => "'" + String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n') + "'";
  const src = 'const ENTRIES = [\n' + allEntries().map((e) =>
    '  {\n' +
    '    date: ' + q(e.date) + ',\n' +
    '    title: ' + q(e.title) + ',\n' +
    '    body: ' + q(e.body) + ',\n' +
    '    tags: [' + (e.tags || []).map(q).join(', ') + '],\n' +
    '  },'
  ).join('\n') + '\n];\n';

  const done = () => toast('已複製 ' + allEntries().length + ' 則。貼給 Claude 重新發布就好。');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = src;
    ta.style.cssText = 'position:fixed;top:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); }
    catch (err) { toast('複製失敗，長按下面的文字自己複製'); prompt('複製這段：', src); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(src).then(done, fallback);
  } else fallback();
}

/* ---- 已讀回條：一次瀏覽只送一筆 ---- */
function pingRead() {
  if (!READ_RECEIPT || !inboxReady() || EDIT) return;
  try { if (sessionStorage.getItem('read-pinged')) return; sessionStorage.setItem('read-pinged', '1'); } catch (e) {}
  const ua = navigator.userAgent;
  const dev = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad'
    : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : '其他';
  const t = new Date();
  const p = (n) => String(n).padStart(2, '0');
  const stamp = `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
  inboxSend(`【已讀】${stamp} · ${dev}`).catch(() => {});
}

/* ---- 起跑 ---- */
refreshStats(true);
paint(0);
pingRead();
</script>
